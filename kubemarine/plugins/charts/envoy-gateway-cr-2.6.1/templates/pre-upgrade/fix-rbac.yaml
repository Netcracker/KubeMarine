{{- if and (hasKey .Values "MANAGED_BY") (eq .Values.MANAGED_BY "argocd") }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pre-upgrade
  namespace: '{{ .Release.Namespace }}'
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    app.kubernetes.io/component: pre-upgrade
rules:
- apiGroups:
    - gateway.envoyproxy.io
  resources:
    - clienttrafficpolicies
  verbs:
    - get
    - list
    - watch
    - delete
- apiGroups:
    - gateway.networking.k8s.io
  resources:
    - gateways
  verbs:
    - get
    - list
    - watch
    - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pre-upgrade
  namespace: '{{ .Release.Namespace }}'
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    app.kubernetes.io/component: pre-upgrade
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pre-upgrade
subjects:
  - kind: ServiceAccount
    name: pre-upgrade
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pre-upgrade
  namespace: '{{ .Release.Namespace }}'
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    app.kubernetes.io/component: pre-upgrade
automountServiceAccountToken: true
{{- end }}
